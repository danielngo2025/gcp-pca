<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PCA — Professional Cloud Architect, Oct 2026</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <h1>PCA <span>· Professional Cloud Architect</span></h1>
    <!-- Four modes, one per job: what now · am I on track · learn · test. -->
    <nav>
      <a href="#today">Today</a>
      <a href="#plan">Plan</a>
      <a href="#study">Study</a>
      <a href="#drill">Drill</a>
    </nav>
    <span class="spacer"></span>
    <button id="btn-export" title="Progress lives in this browser only — export regularly">Export progress</button>
    <button id="btn-import">Import</button>
    <input type="file" id="file-import" accept="application/json" hidden>
  </header>

  <main id="view"></main>

  <!-- Plain script tags, not fetch(): keeps the site working from file:// with no server. -->
  <script src="data/blueprint.js"></script>
  <script src="data/plan.js"></script>
  <script src="data/questions.js"></script>
  <script src="data/decisions.js"></script>
  <script src="data/cases.js"></script>
  <script src="js/store.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
